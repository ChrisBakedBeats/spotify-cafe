<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Café · Spotify</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#120a1f;--ink:#f4e9ff;--pill:rgba(20,10,38,.78);--line:rgba(255,255,255,.18)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;padding:10px 16px;border-radius:24px;background:var(--pill);border:1px solid var(--line);backdrop-filter:blur(10px);width:max-content;max-width:94vw;font-size:13px;box-sizing:border-box}
button,select,input[type=text]{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
button{cursor:pointer}button.on,button:hover{background:rgba(255,255,255,.16)}
select{max-width:150px}input[type=text]{width:130px}
label{display:flex;align-items:center;gap:6px}input[type=range]{width:80px;accent-color:#ff5fa2}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,20,.72);padding:20px;box-sizing:border-box}
#ov.hide{display:none}
#card{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
#card h1{font:400 34px Monoton,'Arial Black',sans-serif;margin:0;color:#ff5fa2}
#msg{margin:0;line-height:1.5;opacity:.9;min-height:1.5em}
#go{padding:14px 26px;font-size:17px;background:#1db954;color:#07130b;border-color:#1db954;font-weight:500}
#amb{position:fixed;right:14px;display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:18px;background:var(--pill);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:13px}
#amb[hidden]{display:none}#amb label{justify-content:space-between}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div id="card"><h1>House Café</h1><p id="msg"></p><button id="go">Connect Spotify</button><button id="demo">Just look around</button></div></div>
<div id="bar">
  <span id="rooms"><button data-r="cafe" class="on">Café</button> <button data-r="rooftop">Rooftop</button> <button data-r="club">Club</button></span>
  <button id="pv">⏮</button><button id="pp">⏯</button><button id="nx">⏭</button>
  <select id="pl"><option value="">Your playlists…</option></select>
  <input id="link" type="text" placeholder="Paste a Spotify link"><button id="lg">Play</button>
  <span id="moods"><button data-m="midnight" class="on">Midnight</button> <button data-m="sunrise">Sunrise</button> <button data-m="deep">Deep</button> <button data-m="neon">Neon</button></span>
  <button id="tap" title="Tap along to the beat to sync the lights">Tap</button><b id="bv">124</b>
  <label title="Film grain, vignette and warm tone">Look <input id="look" type="range" min="0" max="1" step=".01" value=".6"></label>
  <button id="pix" title="Chunky low-res mode">Pixel</button>
  <label title="Softens pulses, strobes and lasers">Chill <input id="en" type="range" min="0" max="1" step=".01" value=".65"> Club</label>
  <button id="ambb">Ambience</button>
  <label>Vol <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></label>
</div>
<div id="amb" hidden><b>Ambience</b>
  <label>🌧 Rain <input type="range" data-k="rain" min="0" max="1" step=".01" value="0"></label>
  <label>💿 Vinyl <input type="range" data-k="vinyl" min="0" max="1" step=".01" value="0"></label>
  <label>🔥 Fire <input type="range" data-k="fire" min="0" max="1" step=".01" value="0"></label>
  <label>☕ Café <input type="range" data-k="cafe" min="0" max="1" step=".01" value="0"></label>
</div>
<script>
/* ===== 1. CONFIG — paste your Spotify app Client ID here ===== */
const CLIENT_ID="PASTE_YOUR_SPOTIFY_CLIENT_ID";
const REDIRECT=location.origin+location.pathname;
const SCOPES="streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private";

/* ===== 2. Spotify auth (Authorization Code + PKCE) ===== */
const LS=localStorage,$=id=>document.getElementById(id);
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const say=m=>$("msg").textContent=m;
async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(48)));LS.setItem("hc_v",v);
  const ch=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({response_type:"code",client_id:CLIENT_ID,scope:SCOPES,redirect_uri:REDIRECT,code_challenge_method:"S256",code_challenge:ch});
}
async function tokReq(body){
  const old=JSON.parse(LS.getItem("hc_tok")||"{}");
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,...body})});
  const j=await r.json();if(!r.ok)throw j;
  LS.setItem("hc_tok",JSON.stringify({a:j.access_token,r:j.refresh_token||old.r,e:Date.now()+j.expires_in*1000}));
}
async function token(){
  let t=JSON.parse(LS.getItem("hc_tok")||"null");if(!t)return null;
  if(t.e-60000<Date.now()){await tokReq({grant_type:"refresh_token",refresh_token:t.r});t=JSON.parse(LS.getItem("hc_tok"))}
  return t.a;
}
async function api(path,opt={}){
  const r=await fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+await token(),"Content-Type":"application/json"}});
  return r.status===204?null:r.json().catch(()=>null);
}

/* ===== 3. Web Playback SDK ===== */
let player,dev,cur,paused=true,npText="",art,artUrl,demo=false;
window.onSpotifyWebPlaybackSDKReady=()=>{
  player=new Spotify.Player({name:"House Café",getOAuthToken:cb=>token().then(cb),volume:+$("vol").value});
  player.addListener("ready",async({device_id})=>{
    dev=device_id;say("Connected. Press the button to step inside.");
    const d=await api("/me/playlists?limit=50");
    (d&&d.items||[]).filter(Boolean).forEach(p=>$("pl").add(new Option(p.name,p.uri)));
    $("pl").value=LS.getItem("hc_pl_"+room)||"";
  });
  player.addListener("player_state_changed",s=>{
    if(!s)return;cur=s.track_window.current_track;paused=s.paused;
    if(cur){npText=cur.name+" — "+cur.artists.map(a=>a.name).join(", ");
      const u=cur.album.images[0]&&cur.album.images[0].url;if(u&&u!==artUrl){artUrl=u;art=new Image();art.src=u}}
  });
  ["initialization_error","authentication_error","account_error","playback_error"].forEach(e=>player.addListener(e,({message})=>{
    say(message+(e==="account_error"?" (Spotify Premium is required.)":""));$("ov").classList.remove("hide")}));
  player.connect();
};
function loadSDK(){const s=document.createElement("script");s.src="https://sdk.scdn.co/spotify-player.js";document.head.appendChild(s)}
function toUri(x){
  x=x.trim();const m=x.match(/open\.spotify\.com\/(?:intl-\w+\/)?(playlist|album|track|artist)\/(\w+)/);
  return m?`spotify:${m[1]}:${m[2]}`:(/^spotify:/.test(x)?x:null);
}
async function playUri(u){
  if(!dev||!u)return;LS.setItem("hc_pl_"+room,u);
  await api("/me/player/play?device_id="+dev,{method:"PUT",body:JSON.stringify(/:track:/.test(u)?{uris:[u]}:{context_uri:u})});
}

/* ===== 4. Startup + controls ===== */
(async()=>{
  const p=new URLSearchParams(location.search);
  if(p.get("code")){
    try{await tokReq({grant_type:"authorization_code",code:p.get("code"),redirect_uri:REDIRECT,code_verifier:LS.getItem("hc_v")})}
    catch(e){say("Login failed: "+(e.error_description||e.error||"unknown error"))}
    history.replaceState({},"",REDIRECT);
  }else if(p.get("error"))say("Spotify said: "+p.get("error"));
  if(CLIENT_ID.startsWith("PASTE")){say("Add your Spotify Client ID at the top of index.html first. The README has the steps.");$("go").style.display="none";return}
  if(LS.getItem("hc_tok")){$("go").textContent="Open the café";if(!$("msg").textContent)say("Connecting to Spotify…");loadSDK()}
  else if(!$("msg").textContent)say("Log in with Spotify Premium to play music in the café.");
})();
$("go").onclick=()=>{
  if(!LS.getItem("hc_tok"))return login();
  if(player){player.activateElement();$("ov").classList.add("hide")}
};
$("demo").onclick=()=>{demo=true;$("ov").classList.add("hide")};
$("pp").onclick=()=>{if(player)player.togglePlay();else demo=!demo};
$("pv").onclick=()=>player&&player.previousTrack();
$("nx").onclick=()=>player&&player.nextTrack();
$("pl").onchange=e=>playUri(e.target.value);
$("lg").onclick=()=>{const u=toUri($("link").value);u?playUri(u):say("That doesn’t look like a Spotify link.")};
$("vol").oninput=e=>player&&player.setVolume(+e.target.value);
addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();$("pp").click()}});

/* ===== 5. Scene ===== */
const cv=$("c"),G=cv.getContext("2d");let g=G,W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;G.setTransform(d,0,0,d,0,0)}
addEventListener("resize",rs);rs();
const P={
  midnight:{top:"#1a0b3a",bot:"#ff6a9a",a:"#ff5fa2",b:"#5ee7ff",wall:"#1b1030",sun:"#ffd2a8"},
  sunrise:{top:"#3a1a4a",bot:"#ffb347",a:"#ffcf5a",b:"#ff6f61",wall:"#2a1424",sun:"#fff0c2"},
  deep:{top:"#06142e",bot:"#1fb7a6",a:"#4df2c0",b:"#6f8bff",wall:"#0b1a2a",sun:"#c9fff1"},
  neon:{top:"#0a0014",bot:"#7a00ff",a:"#ff2bd6",b:"#00f0ff",wall:"#08000f",sun:"#ffffff"}};
let pal=P.midnight,bpm=124,anchor=0,taps=[];
$("moods").onclick=e=>{const m=e.target.dataset.m;if(!m)return;pal=P[m];document.querySelectorAll("#moods button").forEach(b=>b.classList.toggle("on",b===e.target))};
$("tap").onclick=()=>{
  const n=performance.now();if(taps.length&&n-taps[taps.length-1]>2500)taps=[];taps.push(n);anchor=n/1000;
  if(taps.length>=3){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);bpm=Math.max(70,Math.min(180,Math.round(60000/iv)));$("bv").textContent=bpm}
};
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
const R=rnd(42);
const lay=[0,1].map(l=>{const b=[];let x=0;while(x<1){
  const w=.04+R()*.06,h=(l?.2:.3)+R()*(l?.26:.3),cols=Math.max(1,Math.floor(w*40)),rows=Math.floor(h*14),wins=[];
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)if(R()>.35)wins.push({i,j,p:R()*6.28,c:R()});
  b.push({x,w,h,cols,rows,wins});x+=w+R()*.01}return b});
const rain=Array.from({length:80},()=>({x:R(),y:R(),v:.6+R()*.8,l:.03+R()*.04}));
let ang=0,last=0;

function frame(ts){
  const t=ts/1000,dt=Math.min(.05,t-last);last=t;
  const playing=demo||(cur&&!paused);
  const bt=(t-anchor)*bpm/60,ph=((bt%1)+1)%1,ph2=(((bt+.5)%1)+1)%1;
  let kp=.1+.06*Math.sin(t*2),hp=.15,bass=.1,v=i=>.1+.08*Math.sin(t*2+i*.5);
  if(playing){kp=Math.exp(-ph*5);hp=.8*Math.exp(-ph2*9);bass=.3+.5*kp;
    v=i=>(1-i/52)*(.3+.6*kp)*(.65+.35*Math.sin(t*3+i*.9));ang+=dt*3.5*(.4+.6*energy);kp*=.2+.8*energy;hp*=.2+.8*energy;bass*=.5+.5*energy;const v0=v;v=i=>v0(i)*(.5+.5*energy)}else ang+=dt*.3;
  if(pix){const w=Math.ceil(W/PX),h=Math.ceil(H/PX);if(oc.width!==w||oc.height!==h){oc.width=w;oc.height=h}O.setTransform(1/PX,0,0,1/PX,0,0)}
  g=pix?O:G;g.save();
  g.translate(W/2+Math.sin(t*.3)*4*look,H/2+Math.cos(t*.23)*3*look);g.scale(1.02,1.02);g.translate(-W/2,-H/2);
  rooms[room].fn(t,dt,kp,hp,bass,v);
  g.restore();
  if(pix){G.imageSmoothingEnabled=false;G.drawImage(oc,0,0,W,H)}
  g=G;post();
  requestAnimationFrame(frame);
}

/* --- Café room --- */
function cafe(t,dt,kp,hp,bass,v){
  const S=Math.min(W,H)/700+.35,port=W<H,wx=port?W*.05:W*.14,ww=W-wx*2,wy=H*.15,wh=H*.43;

  g.fillStyle=pal.wall;g.fillRect(0,0,W,H);
  let gr=g.createRadialGradient(W/2,wy+wh,0,W/2,wy+wh,Math.max(W,H)*.7);
  gr.addColorStop(0,pal.bot+"55");gr.addColorStop(1,"transparent");g.fillStyle=gr;g.fillRect(0,0,W,H);

  g.save();g.beginPath();g.roundRect(wx,wy,ww,wh,10);g.clip();
  gr=g.createLinearGradient(0,wy,0,wy+wh);gr.addColorStop(0,pal.top);gr.addColorStop(1,pal.bot);
  g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);
  const sr=wh*.24*(1+.05*kp),sx=wx+ww/2,sy=wy+wh*.6;
  gr=g.createRadialGradient(sx,sy,sr*.2,sx,sy,sr*2.4);gr.addColorStop(0,pal.sun+"aa");gr.addColorStop(1,"transparent");
  g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);g.fillStyle=pal.sun;g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
  const base=wy+wh*.9;
  lay.forEach((L,l)=>L.forEach(b=>{
    const bx=wx+b.x*ww,bw=b.w*ww,bh=b.h*wh;
    g.fillStyle=l?"#0a0618":"rgba(24,12,52,.78)";g.fillRect(bx,base-bh,bw,bh);
    const cw=bw/b.cols,rh=(bh-14)/Math.max(1,b.rows);
    b.wins.forEach(w=>{if(Math.sin(t*.4+w.p*3)<-.2)return;
      g.globalAlpha=Math.min(1,(.22+.8*kp)*(l?1:.6));g.fillStyle=w.c<.5?pal.a:w.c<.85?pal.b:pal.sun;
      g.fillRect(bx+w.i*cw+cw*.25,base-bh+8+w.j*rh,cw*.5,rh*.5)});
    g.globalAlpha=1}));
  g.fillStyle="#0a0618";g.fillRect(wx,base,ww,wy+wh-base);
  g.globalCompositeOperation="lighter";
  const n=48,bw2=ww/n;gr=g.createLinearGradient(0,wy+wh,0,wy+wh*.45);gr.addColorStop(0,pal.a);gr.addColorStop(1,pal.b);
  g.fillStyle=gr;g.globalAlpha=.75;
  for(let i=0;i<n;i++){const h=Math.max(3,v(i)*wh*.5);g.fillRect(wx+i*bw2+bw2*.18,wy+wh-h,bw2*.64,h)}
  g.globalAlpha=1;g.globalCompositeOperation="source-over";
  g.strokeStyle="rgba(200,220,255,.28)";g.lineWidth=1;g.beginPath();
  rain.forEach(d=>{d.y+=dt*d.v*.9;if(d.y>1){d.y=-.1;d.x=R()}const x=wx+d.x*ww,y=wy+d.y*wh;g.moveTo(x,y);g.lineTo(x-2,y+d.l*wh)});g.stroke();
  g.restore();
  g.strokeStyle="#08040f";g.lineWidth=10;g.beginPath();g.roundRect(wx,wy,ww,wh,10);g.stroke();
  g.lineWidth=6;g.beginPath();g.moveTo(wx+ww/3,wy);g.lineTo(wx+ww/3,wy+wh);g.moveTo(wx+ww*2/3,wy);g.lineTo(wx+ww*2/3,wy+wh);g.moveTo(wx,wy+wh*.45);g.lineTo(wx+ww,wy+wh*.45);g.stroke();
  g.fillStyle="#120a1f";g.fillRect(wx-14,wy+wh+3,ww+28,12);

  const dy=H*.68;g.fillStyle="#150b24";g.fillRect(0,dy,W,H-dy);
  g.fillStyle=pal.a;g.globalAlpha=.35+.4*kp;g.fillRect(0,dy,W,2);g.globalAlpha=1;

  // turntable (label shows the album art)
  const R0=Math.min(W*.2,170*S),tx=W*(port?.42:.4),ty=H*.83;
  g.fillStyle="#1c1230";g.beginPath();g.roundRect(tx-R0*1.3,ty-R0*.5,R0*2.6,R0*.95,12);g.fill();
  g.save();g.translate(tx,ty);g.scale(1,.3);
  g.fillStyle="#0b0713";g.beginPath();g.arc(0,0,R0*(1+.015*kp),0,7);g.fill();
  g.strokeStyle="rgba(255,255,255,.08)";g.lineWidth=1.5;
  for(let r=.4;r<.95;r+=.1){g.beginPath();g.arc(0,0,R0*r,0,7);g.stroke()}
  g.fillStyle=pal.a;g.beginPath();g.arc(0,0,R0*.3,0,7);g.fill();
  g.rotate(ang);
  if(art&&art.complete&&art.naturalWidth){g.save();g.beginPath();g.arc(0,0,R0*.3,0,7);g.clip();g.drawImage(art,-R0*.3,-R0*.3,R0*.6,R0*.6);g.restore()}
  g.strokeStyle="#fff";g.lineWidth=4;g.beginPath();g.moveTo(R0*.12,0);g.lineTo(R0*.3,0);g.stroke();
  g.restore();
  g.strokeStyle="#cfc3e6";g.lineWidth=3;g.beginPath();g.moveTo(tx+R0*1.1,ty-R0*.3);g.lineTo(tx+R0*.35,ty+R0*.02+kp*2);g.stroke();
  g.fillStyle="#cfc3e6";g.beginPath();g.arc(tx+R0*1.1,ty-R0*.3,5,0,7);g.fill();

  // coffee cup + steam
  const cx=W*(port?.82:.7),cy=H*.78;
  g.fillStyle="#2a1c40";g.beginPath();g.ellipse(cx,cy,48*S,11*S,0,0,7);g.fill();
  g.fillStyle="#efe4ff";g.beginPath();g.moveTo(cx-30*S,cy-42*S);g.lineTo(cx+30*S,cy-42*S);g.lineTo(cx+22*S,cy);g.lineTo(cx-22*S,cy);g.closePath();g.fill();
  g.strokeStyle="#efe4ff";g.lineWidth=5*S;g.beginPath();g.arc(cx+32*S,cy-24*S,10*S,-1.5,1.5);g.stroke();
  g.fillStyle="#3b2214";g.beginPath();g.ellipse(cx,cy-42*S,30*S,6*S,0,0,7);g.fill();
  g.lineWidth=2.5;g.lineCap="round";
  for(let k=0;k<5;k++){g.strokeStyle=`rgba(255,255,255,${.22+bass*.3})`;g.beginPath();
    const hg=(60+bass*80)*S;
    for(let h=0;h<=hg;h+=4){const x=cx+(k-2)*9*S+Math.sin(t*2+k+h*.07)*6*S,y=cy-46*S-h;h?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}

  // cat
  const kx=W*(port?.14:.13),ky=H*.745,bob=kp*3*S;
  g.fillStyle="#07030d";g.strokeStyle=pal.a+"88";g.lineWidth=1.5;
  g.beginPath();g.ellipse(kx,ky-26*S,30*S,26*S,0,0,7);g.fill();g.stroke();
  g.beginPath();g.arc(kx+16*S,ky-58*S+bob,16*S,0,7);g.fill();g.stroke();
  [[6,-70],[24,-70]].forEach(([ex,ey])=>{g.beginPath();g.moveTo(kx+ex*S,ky+ey*S+bob);g.lineTo(kx+(ex+4)*S,ky+(ey-12)*S+bob);g.lineTo(kx+(ex+11)*S,ky+(ey+3)*S+bob);g.fill()});
  g.beginPath();g.moveTo(kx-28*S,ky-12*S);g.bezierCurveTo(kx-55*S,ky-10*S,kx-50*S,ky-50*S+Math.sin(t*2)*8*S,kx-36*S,ky-52*S);
  g.lineWidth=7*S;g.strokeStyle="#07030d";g.stroke();
  g.strokeStyle=pal.sun;g.lineWidth=1.5;
  [11,22].forEach(o=>{g.beginPath();g.arc(kx+o*S,ky-58*S+bob,3*S,.2,Math.PI-.2);g.stroke()});

  // string lights
  const N=22,wy2=i=>H*.02+Math.abs(Math.sin(i/N*Math.PI*3))*H*.025;
  g.strokeStyle="#08040f";g.lineWidth=1.5;g.beginPath();
  for(let i=0;i<=N;i++){const x=W*i/N;i?g.lineTo(x,wy2(i)):g.moveTo(x,wy2(i))}g.stroke();
  for(let i=0;i<=N;i++){const c=[pal.a,pal.b,pal.sun][i%3],q=i%2?hp:kp;
    g.fillStyle=c;g.shadowColor=c;g.shadowBlur=8+16*q;g.beginPath();g.arc(W*i/N,wy2(i)+6,3.5+2*q,0,7);g.fill()}
  // neon sign + now playing
  g.textAlign="center";g.textBaseline="middle";
  g.shadowBlur=18+34*kp;g.shadowColor=pal.a;g.fillStyle=pal.a;
  g.font=`${Math.min(W*.075,58)}px Monoton,'Arial Black',sans-serif`;
  g.globalAlpha=.88+.12*Math.sin(t*23)*(1-kp);g.fillText("HOUSE CAFÉ",W/2,H*.097);
  g.globalAlpha=1;g.shadowBlur=0;
  g.font="500 15px 'DM Sans',system-ui,sans-serif";g.fillStyle=pal.sun;
  g.fillText(npText||(demo?"demo mode · tap along to sync":""),W/2,H*.637,W*.82);
}

/* ===== Rooms ===== */
let gr2;
function sign(txt,y,kp,t,size){g.textAlign="center";g.textBaseline="middle";g.shadowBlur=18+34*kp;g.shadowColor=pal.a;g.fillStyle=pal.a;
  g.font=`${size}px Monoton,'Arial Black',sans-serif`;g.globalAlpha=.88+.12*Math.sin(t*23)*(1-kp);g.fillText(txt,W/2,y);g.globalAlpha=1;g.shadowBlur=0}
function np(y){g.textAlign="center";g.textBaseline="middle";g.font="500 15px 'DM Sans',system-ui,sans-serif";g.fillStyle=pal.sun;
  g.fillText(npText||(demo?"demo mode · tap along to sync":""),W/2,y,W*.82)}
function bulbs(y0,amp,N,kp,hp){
  const pt=i=>[W*.03+W*.94*i/N,y0+amp*Math.sin(i/N*Math.PI)];
  g.strokeStyle="#08040f";g.lineWidth=1.5;g.beginPath();
  for(let i=0;i<=N;i++){const[x,y]=pt(i);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  for(let i=0;i<=N;i++){const[x,y]=pt(i),c=[pal.a,pal.b,pal.sun][i%3],q=i%2?hp:kp;
    g.fillStyle=c;g.shadowColor=c;g.shadowBlur=8+16*q;g.beginPath();g.arc(x,y+6,3.5+2*q,0,7);g.fill()}
  g.shadowBlur=0}
function deck(tx,ty,R0,kp){
  g.fillStyle="#1c1230";g.beginPath();g.roundRect(tx-R0*1.3,ty-R0*.5,R0*2.6,R0*.95,12);g.fill();
  g.save();g.translate(tx,ty);g.scale(1,.3);
  g.fillStyle="#0b0713";g.beginPath();g.arc(0,0,R0*(1+.015*kp),0,7);g.fill();
  g.strokeStyle="rgba(255,255,255,.08)";g.lineWidth=1.5;
  for(let r=.4;r<.95;r+=.1){g.beginPath();g.arc(0,0,R0*r,0,7);g.stroke()}
  g.fillStyle=pal.a;g.beginPath();g.arc(0,0,R0*.3,0,7);g.fill();g.rotate(ang);
  if(art&&art.complete&&art.naturalWidth){g.save();g.beginPath();g.arc(0,0,R0*.3,0,7);g.clip();g.drawImage(art,-R0*.3,-R0*.3,R0*.6,R0*.6);g.restore()}
  g.strokeStyle="#fff";g.lineWidth=4;g.beginPath();g.moveTo(R0*.12,0);g.lineTo(R0*.3,0);g.stroke();g.restore();
  g.strokeStyle="#cfc3e6";g.lineWidth=3;g.beginPath();g.moveTo(tx+R0*1.1,ty-R0*.3);g.lineTo(tx+R0*.35,ty+R0*.02+kp*2);g.stroke();
  g.fillStyle="#cfc3e6";g.beginPath();g.arc(tx+R0*1.1,ty-R0*.3,5,0,7);g.fill()}
function skyline(base,hs,t,kp){
  lay.forEach((L,l)=>L.forEach(b=>{
    const bx=b.x*W,bw=b.w*W,bh=b.h*hs;
    g.fillStyle=l?"#0a0618":"rgba(24,12,52,.8)";g.fillRect(bx,base-bh,bw,bh+2);
    const cw=bw/b.cols,rh=(bh-14)/Math.max(1,b.rows);
    b.wins.forEach(w=>{if(Math.sin(t*.4+w.p*3)<-.2)return;
      g.globalAlpha=Math.min(1,(.22+.8*kp)*(l?1:.6));g.fillStyle=w.c<.5?pal.a:w.c<.85?pal.b:pal.sun;
      g.fillRect(bx+w.i*cw+cw*.25,base-bh+8+w.j*rh,cw*.5,rh*.5)});g.globalAlpha=1}))}

/* --- Rooftop: sunrise rays driven by the spectrum --- */
const stars=Array.from({length:70},()=>({x:R(),y:R()*.5,p:R()*6.28,s:1+R()*1.5}));
function rooftop(t,dt,kp,hp,bass,v){
  const S=Math.min(W,H)/700+.35,port=W<H;
  let gr=g.createLinearGradient(0,0,0,H*.68);gr.addColorStop(0,pal.top);gr.addColorStop(1,pal.bot);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle="#fff";stars.forEach(s=>{g.globalAlpha=.25+.5*Math.abs(Math.sin(t*.8+s.p));g.fillRect(s.x*W,s.y*H,s.s,s.s)});g.globalAlpha=1;
  const sx=W/2,sy=H*.5,sr=Math.min(W,H)*.1*(1+.05*kp);
  g.globalCompositeOperation="lighter";g.lineCap="round";g.lineWidth=Math.max(2,W/220);
  for(let i=0;i<48;i++){const a=Math.PI+(i+.5)/48*Math.PI,c=Math.cos(a),s=Math.sin(a),L=sr*1.4+v(i)*H*.3;
    g.strokeStyle=i%2?pal.a:pal.b;g.globalAlpha=.5;g.beginPath();g.moveTo(sx+c*sr*1.2,sy+s*sr*1.2);g.lineTo(sx+c*L,sy+s*L);g.stroke()}
  g.globalAlpha=1;g.globalCompositeOperation="source-over";
  gr=g.createRadialGradient(sx,sy,sr*.3,sx,sy,sr*2.6);gr.addColorStop(0,pal.sun+"cc");gr.addColorStop(1,"transparent");g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle=pal.sun;g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
  g.fillStyle=pal.top+"aa";
  for(let i=0;i<3;i++){const x=((t*(6+i*4)+i*W*.4)%(W*1.4))-W*.2;g.beginPath();g.ellipse(x,H*(.13+i*.07),110*S,16*S,0,0,7);g.fill()}
  skyline(H*.66,H*.4,t,kp);
  g.fillStyle=pal.wall;g.fillRect(0,H*.66,W,H*.34);
  g.fillStyle=pal.a;g.globalAlpha=.4+.4*kp;g.fillRect(0,H*.66,W,3);g.globalAlpha=1;
  [port?.13:.2,port?.87:.8].forEach(fx=>{const x=W*fx,w=90*S,h=170*S,y=H*.97-h;
    g.fillStyle="#0b0614";g.beginPath();g.roundRect(x-w/2,y,w,h,8);g.fill();g.strokeStyle=pal.b+"99";g.lineWidth=2;g.stroke();
    g.fillStyle="#1a1030";g.beginPath();g.arc(x,y+h*.28,14*S,0,7);g.fill();
    g.beginPath();g.arc(x,y+h*.68,30*S*(1+.1*kp),0,7);g.fill();g.strokeStyle=pal.a;g.stroke()});
  deck(W/2,H*.86,Math.min(W*.17,140*S),kp);
  bulbs(H*.17,H*.035,16,kp,hp);
  sign("ROOFTOP",H*.09,kp,t,Math.min(W*.085,64));np(H*.715);
}

/* --- Club: lasers, LED wall, floor grid, crowd --- */
function club(t,dt,kp,hp,bass,v){
  const S=Math.min(W,H)/700+.35,hz=H*.62;let gr;
  g.fillStyle=pal.wall;g.fillRect(0,0,W,H);
  g.globalCompositeOperation="lighter";g.lineCap="round";
  for(let k=0;k<6;k++){const x=W*(.1+.8*k/5),a=Math.sin(t*.9+k*1.3)*.7+(k%2?.25:-.25);
    g.strokeStyle=k%2?pal.a:pal.b;g.globalAlpha=.12+.5*kp;g.lineWidth=2+3*kp;
    g.beginPath();g.moveTo(x,0);g.lineTo(x+Math.sin(a)*H*1.3,Math.cos(a)*H*1.3);g.stroke()}
  g.globalAlpha=1;g.globalCompositeOperation="source-over";
  const sw=Math.min(W*.8,760*S),sh=H*.28,sx0=(W-sw)/2,sy0=H*.17,nb=32,bw=sw/nb,sg=sh/12;
  g.fillStyle="#05000d";g.fillRect(sx0,sy0,sw,sh);
  for(let i=0;i<nb;i++){const n=Math.round(v(i*1.45)*12);
    for(let j=0;j<n;j++){g.fillStyle=j<6?pal.b:j<10?pal.a:"#fff";g.fillRect(sx0+i*bw+2,sy0+sh-(j+1)*sg+1,bw-4,sg-3)}}
  g.strokeStyle=pal.a;g.lineWidth=3;g.shadowColor=pal.a;g.shadowBlur=14+14*kp;g.strokeRect(sx0,sy0,sw,sh);g.shadowBlur=0;
  gr=g.createLinearGradient(0,hz,0,H);gr.addColorStop(0,"#05000d");gr.addColorStop(1,pal.wall);g.fillStyle=gr;g.fillRect(0,hz,W,H-hz);
  g.strokeStyle=pal.b;g.globalAlpha=.25+.4*kp;g.lineWidth=1.5;g.beginPath();
  for(let i=-9;i<=9;i++){g.moveTo(W/2,hz);g.lineTo(W/2+i*W*.14,H)}
  const off=(t*.35)%1;for(let k=0;k<10;k++){const y=hz+(H-hz)*Math.pow((k+off)/10,2);g.moveTo(0,y);g.lineTo(W,y)}
  g.stroke();g.globalAlpha=1;
  [0,1].forEach(i=>{const fx=W*(.3+.4*i)+Math.sin(t*.3+i*3)*W*.12;
    gr=g.createRadialGradient(fx,H*.7,0,fx,H*.7,W*.35);gr.addColorStop(0,pal.a+"28");gr.addColorStop(1,"transparent");g.fillStyle=gr;g.fillRect(0,hz-40,W,H)});
  const R0=Math.min(W*.12,110*S);
  g.fillStyle="#0d0420";g.beginPath();g.roundRect(W/2-R0*1.9,H*.7,R0*3.8,H*.2,10);g.fill();
  g.strokeStyle=pal.a;g.lineWidth=2;g.shadowColor=pal.a;g.shadowBlur=10;g.stroke();g.shadowBlur=0;
  deck(W/2,H*.8,R0,kp);
  g.lineWidth=2;
  for(let i=0;i<14;i++){const x=(i+.5)/14*W,b=kp*14*S*(.6+.4*Math.sin(i*2.1)),y=H*.97-(i%3)*10*S-b;
    g.fillStyle="#05000d";g.strokeStyle=pal.a+"88";
    g.beginPath();g.ellipse(x,y+26*S,32*S,26*S,0,0,7);g.fill();g.stroke();
    g.beginPath();g.arc(x,y-4*S,16*S,0,7);g.fill();g.stroke();
    if(i%4===1){g.strokeStyle="#05000d";g.lineWidth=7*S;g.beginPath();g.moveTo(x+14*S,y+10*S);g.lineTo(x+26*S,y-40*S-b);g.stroke();g.lineWidth=2}}
  g.fillStyle="#fff";g.globalAlpha=Math.max(0,kp-.85)*.7;g.fillRect(0,0,W,H);g.globalAlpha=1;
  sign("AFTER HOURS",H*.1,kp,t,Math.min(W*.065,52));np(sy0+sh+22*S);
}

/* --- Room registry, switching, hash links (#cafe, #rooftop, #club) --- */
const rooms={cafe:{fn:cafe,mood:"midnight",bpm:122},rooftop:{fn:rooftop,mood:"sunrise",bpm:118},club:{fn:club,mood:"neon",bpm:128}};
let room="cafe";
function setRoom(r){
  if(!rooms[r])r="cafe";room=r;const cfg=rooms[r];pal=P[cfg.mood];bpm=cfg.bpm;$("bv").textContent=bpm;
  document.querySelectorAll("#rooms button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));
  document.querySelectorAll("#moods button").forEach(b=>b.classList.toggle("on",b.dataset.m===cfg.mood));
  $("pl").value=LS.getItem("hc_pl_"+r)||"";
}
$("rooms").onclick=e=>{const r=e.target.dataset.r;if(!r)return;location.hash=r;setRoom(r);const u=LS.getItem("hc_pl_"+r);if(u&&dev)playUri(u)};

setRoom(location.hash.slice(1));

/* ===== Lofi layer: warm look, chill↔club slider, ambient mixer ===== */
let look=.6,pix=false,energy=.65;const PX=3;
const ambLvl={rain:0,vinyl:0,fire:0,cafe:0},AMB_SCALE={rain:.4,vinyl:.9,fire:.8,cafe:.9};
const oc=document.createElement("canvas"),O=oc.getContext("2d");
// film grain tile
const gcv=document.createElement("canvas");gcv.width=gcv.height=160;
{const c=gcv.getContext("2d"),im=c.createImageData(160,160);
 for(let i=0;i<im.data.length;i+=4){const n=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=n;im.data[i+3]=255}c.putImageData(im,0,0)}
const gpat=G.createPattern(gcv,"repeat");
function post(){
  if(look<=0)return;
  G.save();
  G.globalCompositeOperation="soft-light";G.globalAlpha=.5*look;G.fillStyle="#ff9a55";G.fillRect(0,0,W,H);
  G.globalCompositeOperation="source-over";G.globalAlpha=1;
  const vg=G.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,`rgba(8,2,16,${.6*look})`);
  G.fillStyle=vg;G.fillRect(0,0,W,H);
  G.globalAlpha=.09*look;G.translate((Math.random()*160)|0,(Math.random()*160)|0);
  G.fillStyle=gpat;G.fillRect(-160,-160,W+160,H+160);
  G.restore();
}
// saved settings
try{const s=JSON.parse(LS.getItem("hc_set")||"null");
  if(s){look=s.look??look;pix=!!s.pix;energy=s.energy??energy;Object.assign(ambLvl,s.amb||{})}}catch(e){}
const save=()=>LS.setItem("hc_set",JSON.stringify({look,pix,energy,amb:ambLvl}));
$("look").value=look;$("en").value=energy;$("pix").classList.toggle("on",pix);
document.querySelectorAll("#amb input").forEach(i=>i.value=ambLvl[i.dataset.k]);
$("look").oninput=e=>{look=+e.target.value;save()};

// ambient layers: synthesized in the page, so they mix with Spotify without touching it
let ac2;const ambG={};
function apply(k){if(ac2&&ambG[k])ambG[k].gain.setTargetAtTime(Math.pow(ambLvl[k],1.5)*AMB_SCALE[k],ac2.currentTime,.1)}
function clink(){const t=ac2.currentTime,f=2300+Math.random()*1800;
  [1,1.5].forEach((m,i)=>{const o=ac2.createOscillator(),gn=ac2.createGain();o.frequency.value=f*m;
    gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.05*ambLvl.cafe/(i+1),t+.003);gn.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(gn);gn.connect(ac2.destination);o.start(t);o.stop(t+.2)})}
function ambInit(){
  if(ac2){ac2.resume();return}
  ac2=new (window.AudioContext||window.webkitAudioContext)();
  const nb=(sec,fn)=>{const b=ac2.createBuffer(1,ac2.sampleRate*sec,ac2.sampleRate);fn(b.getChannelData(0));return b};
  const mk=(buf,fl)=>{const s=ac2.createBufferSource();s.buffer=buf;s.loop=true;let n=s;
    fl.forEach(([ty,f,q])=>{const b=ac2.createBiquadFilter();b.type=ty;b.frequency.value=f;b.Q.value=q||.7;n.connect(b);n=b});
    const gn=ac2.createGain();gn.gain.value=0;n.connect(gn);gn.connect(ac2.destination);s.start();return gn};
  const white=nb(4,d=>{for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1});
  const crackle=nb(5,d=>{for(let i=0;i<d.length;i++)d[i]=Math.random()<.0009?(Math.random()*2-1)*(.4+Math.random()*.6):(Math.random()*2-1)*.008});
  const fire=nb(5,d=>{let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3+(Math.random()<.0006?Math.random()*2-1:0)}});
  ambG.rain=mk(white,[["highpass",500],["lowpass",7000]]);
  ambG.vinyl=mk(crackle,[["highpass",800]]);
  ambG.fire=mk(fire,[["lowpass",1800]]);
  ambG.cafe=mk(white,[["bandpass",900,.5],["lowpass",2200]]);
  setInterval(()=>{if(ac2.state==="running"&&ambLvl.cafe>.05&&Math.random()<.4)clink()},2200);
  Object.keys(ambLvl).forEach(apply);
}
$("amb").oninput=e=>{const k=e.target.dataset.k;if(!k)return;ambInit();ambLvl[k]=+e.target.value;apply(k);save()};
addEventListener("pointerdown",()=>{if(Object.values(ambLvl).some(x=>x>0))ambInit()},{once:true});
